spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: true
    consumer:
      group-id: bromo-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.bromo.domain.model,io.bromo.domain.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:bromo}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bromo}
    username: ${POSTGRES_USER:bromo}
    password: ${POSTGRES_PASSWORD:bromo}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bromo_auth
  flyway:
    enabled: true
    schemas: bromo_auth,bromo_config,bromo_alerts
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

bromo:
  export:
    posthog:
      enabled: ${POSTHOG_ENABLED:false}
      api-key: ${POSTHOG_API_KEY:}
      host: ${POSTHOG_HOST:https://app.posthog.com}
