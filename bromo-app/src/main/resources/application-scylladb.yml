# ScyllaDB profile. Opt-in via SPRING_PROFILES_ACTIVE=scylladb.
# ScyllaDB is wire-compatible with Cassandra (CQL protocol v3/v4), so the same
# spring.cassandra.* config keys apply. Only the contact-points differ (in the
# default docker-compose setup, the service is named "scylladb" instead of
# "cassandra"). Override via env var when running outside docker:
#   SCYLLADB_CONTACT_POINTS=my-scylla-node-1,scylla-node-2
spring:
  config:
    activate:
      on-profile: scylladb
  cassandra:
    contact-points: ${SCYLLADB_CONTACT_POINTS:scylladb:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:bromo}
    local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
  data:
    cassandra:
      repositories:
        enabled: true
