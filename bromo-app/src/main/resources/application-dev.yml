spring:
  # In dev we use in-memory adapters. Real infrastructure is configured in
  # application-prod.yml. Kafka is auto-configured from spring-boot-starter-kafka;
  # disable auto-startup of listeners when no broker is available.
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.bromo.domain.model,io.bromo.domain.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
  # Disable Cassandra/Postgres/Redis auto-configuration in dev (no broker running).
  # Spring Boot 4 restructured autoconfig packages. The new FQNs put each module
  # under org.springframework.boot.<module>.autoconfigure (no longer under
  # org.springframework.boot.autoconfigure.<module>).
  autoconfigure:
    exclude:
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.DataCassandraAutoConfiguration
      - org.springframework.boot.cassandra.autoconfigure.CassandraRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
