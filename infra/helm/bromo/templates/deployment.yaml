apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bromo.fullname" . }}
  labels:
    {{- include "bromo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bromo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bromo.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfiles.active | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: CASSANDRA_CONTACT_POINTS
              value: {{ .Values.cassandra.contactPoints | quote }}
            - name: CASSANDRA_KEYSPACE
              value: {{ .Values.cassandra.keyspace | quote }}
            - name: CASSANDRA_DATACENTER
              value: {{ .Values.cassandra.datacenter | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.posthog.enabled }}
            - name: POSTHOG_ENABLED
              value: "true"
            - name: POSTHOG_HOST
              value: {{ .Values.posthog.host | quote }}
            {{- end }}
          {{- if .Values.postgres.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.existingSecret }}
          {{- end }}
          {{- if and .Values.posthog.enabled .Values.posthog.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.posthog.existingSecret }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
