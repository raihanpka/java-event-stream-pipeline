# Bromo Helm values. Override per environment with `-f values-prod.yaml`.

replicaCount: 1

image:
  repository: ghcr.io/raihanpka/bromo
  tag: bromo-app-latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bromo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Bromo Spring profile
springProfiles:
  active: prod

# External service endpoints
kafka:
  bootstrapServers: kafka:9092

cassandra:
  contactPoints: cassandra:9042
  keyspace: bromo
  datacenter: datacenter1

postgres:
  host: postgres
  port: 5432
  database: bromo
  user: bromo
  # Use an existing secret (recommended): createSecret: true
  existingSecret: ""
  existingSecretPasswordKey: postgres-password

redis:
  host: redis
  port: 6379

# Optional: PostHog analytics export
posthog:
  enabled: false
  host: https://app.posthog.com
  existingSecret: ""
  existingSecretApiKeyKey: posthog-api-key

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

podSecurityContext: {}
securityContext: {}
