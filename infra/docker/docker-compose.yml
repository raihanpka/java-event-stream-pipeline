# Bromo local stack. One command: `docker compose -f infra/docker/docker-compose.yml up -d`.
# Pulls all images, creates the network, and starts Kafka, Cassandra, PostgreSQL, Redis, and Bromo.

services:

  # ---- Event bus (KRaft mode, single broker) ----
  kafka:
    image: bitnami/kafka:3.8
    container_name: bromo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - bromo-net

  # ---- Time-series store ----
  cassandra:
    image: cassandra:5.0.8
    container_name: bromo-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "bromo"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      HEAP_NEWSIZE: "128M"
      MAX_HEAP_SIZE: "512M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - bromo-net

  # ---- Metadata store (auth, config, alerts) ----
  postgres:
    image: postgres:16-alpine
    container_name: bromo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bromo
      POSTGRES_USER: bromo
      POSTGRES_PASSWORD: bromo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bromo -d bromo || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bromo-net

  # ---- Cache (rate limit, JWT blacklist) ----
  redis:
    image: redis:7-alpine
    container_name: bromo-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - bromo-net

  # ---- Bromo application (pre-built image from GHCR) ----
  bromo:
    image: ghcr.io/raihanpka/bromo:bromo-app-latest
    container_name: bromo-app
    profiles: ["with-app"]   # opt-in: `docker compose --profile with-app up`
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bromo
      POSTGRES_USER: bromo
      POSTGRES_PASSWORD: bromo
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - bromo-net

volumes:
  kafka-data:
  cassandra-data:
  postgres-data:
  redis-data:

networks:
  bromo-net:
    driver: bridge
